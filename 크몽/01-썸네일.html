<!doctype html>
<meta charset="utf-8">
<title>MEISTERCODE — 크몽 썸네일 652×488</title>
<link rel="stylesheet" href="css/base.css">
<style>
.canvas{width:652px;height:488px;display:flex;flex-direction:column;background:var(--black)}
.beam{background:
  radial-gradient(ellipse 60% 55% at 95% 6%, rgba(46,123,246,.42) 0%, transparent 60%),
  radial-gradient(ellipse 40% 40% at 8% 96%, rgba(46,123,246,.10) 0%, transparent 60%)}
.main{flex:1;display:flex;align-items:center;padding:0 26px 0 34px;position:relative;z-index:2;gap:16px}

/* ── 좌측 ─────────────────────────── */
.left{width:57%}
.tag{display:inline-block;background:var(--blue);color:#fff;font-size:12.5px;font-weight:800;
  letter-spacing:-.02em;padding:5.5px 12px;border-radius:5px;margin-bottom:14px}

h1{font-size:35px;font-weight:900;line-height:1.24;letter-spacing:-.048em;color:#fff;
  margin-bottom:11px}

.sub{font-size:13.5px;font-weight:600;color:var(--gray);letter-spacing:-.028em;margin-bottom:17px}

.p-row{display:flex;align-items:baseline;gap:9px;margin-bottom:1px}
.p-old{font-size:14px;font-weight:600;color:#57616f;text-decoration:line-through;
  text-decoration-thickness:1.5px}
.p-lab{font-size:12.5px;font-weight:800;color:var(--blue-lit);letter-spacing:-.02em}
.p-big{display:block;font-size:55px;font-weight:900;color:var(--blue);letter-spacing:-.055em;
  line-height:1;text-shadow:0 0 40px rgba(46,123,246,.55)}
.p-note{font-size:11.5px;font-weight:600;color:#6c7889;margin-top:9px;letter-spacing:-.015em}

/* ── 우측: 다크 브라우저 목업 + 채팅 ── */
.right{width:43%;display:flex;justify-content:flex-end}
.win{width:100%;max-width:250px;background:#0B1017;border:1px solid rgba(255,255,255,.13);
  border-radius:10px;overflow:hidden;box-shadow:0 22px 50px rgba(0,0,0,.75),
  0 0 0 1px rgba(46,123,246,.10), 0 0 60px rgba(46,123,246,.14)}
.win__bar{height:24px;background:#141B25;display:flex;align-items:center;gap:5px;padding:0 10px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.dot{width:7px;height:7px;border-radius:50%}
.win__url{margin-left:6px;height:9px;flex:1;border-radius:3px;background:rgba(255,255,255,.07)}
.win__body{padding:13px 12px 14px}

.time{font-size:9.5px;font-weight:700;color:#5b6577;letter-spacing:.03em;
  text-align:center;margin-bottom:11px}

.msg{width:fit-content;max-width:86%;font-size:10.5px;font-weight:600;line-height:1.4;padding:7px 10px;
  border-radius:11px;letter-spacing:-.01em;margin-bottom:7px}
.msg--in{background:#1C2530;color:#D6DEE9;border-bottom-left-radius:3px}
.msg--out{background:var(--blue);color:#fff;border-bottom-right-radius:3px;margin-left:auto}
.who{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.who__d{width:5px;height:5px;border-radius:50%;background:#2ED573}
.who__t{font-size:9px;font-weight:800;color:#7c8697;letter-spacing:.03em}

/* ── 하단 바 ──────────────────────── */
.foot{height:44px;flex:0 0 44px;z-index:2;background:#0A0D14;
  border-top:1px solid rgba(255,255,255,.09);
  display:flex;align-items:center;justify-content:center;gap:10px}
.foot__m{font-size:15px;font-weight:900;letter-spacing:.02em;color:#fff}
.foot__c{color:var(--blue)}
.foot__s{width:1px;height:13px;background:rgba(255,255,255,.2)}
.foot__t{font-size:12px;font-weight:600;color:#8d97a6;letter-spacing:-.022em}
</style>

<div class="canvas">
  <div class="beam"></div>

  <div class="main">
    <div class="left">
      <span class="tag">제조업·수출기업 전문</span>
      <h1>해외 바이어 문의,<br>새벽에도<br>AI가 응대합니다</h1>
      <p class="sub">AI챗봇 · 다국어 · CMS 전부 기본 포함</p>
      <div class="p-row">
        <span class="p-old">45만원</span>
        <span class="p-lab">런칭특가</span>
      </div>
      <span class="p-big">29만원~</span>
      <p class="p-note">선착순 10팀</p>
    </div>

    <div class="right">
      <div class="win">
        <div class="win__bar">
          <span class="dot" style="background:#FF5F57"></span>
          <span class="dot" style="background:#FEBC2E"></span>
          <span class="dot" style="background:#28C840"></span>
          <span class="win__url"></span>
        </div>
        <div class="win__body">
          <p class="time">새벽 3:12 AM</p>
          <div class="msg msg--in">Delivery time?</div>
          <div class="who">
            <span class="who__d"></span>
            <span class="who__t">AI 자동응대</span>
          </div>
          <div class="msg msg--out">2-3 weeks. May I have your email?</div>
          <div class="msg msg--in">buyer@company.com</div>
        </div>
      </div>
    </div>
  </div>

  <div class="foot">
    <span class="foot__m">MEISTER<span class="foot__c">CODE</span></span>
    <span class="foot__s"></span>
    <span class="foot__t">결국엔 사람의 손이 닿아야 합니다</span>
  </div>
</div>
