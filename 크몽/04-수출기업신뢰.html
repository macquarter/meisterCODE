<!doctype html>
<meta charset="utf-8">
<title>MEISTERCODE — 수출기업 신뢰 섹션 860w</title>
<link rel="stylesheet" href="fonts/fraunces.css">
<link rel="stylesheet" href="css/base.css">
<style>
body{display:flex;justify-content:center;align-items:flex-start}
.canvas{
  width:860px;padding:72px 60px 62px;
  background:
    radial-gradient(ellipse 55% 40% at 50% 0%, rgba(31,61,140,.5) 0%, transparent 65%),
    #0A0E1A;
}
.inner{position:relative;z-index:2}

h2{font-size:40px;font-weight:900;letter-spacing:-.042em;color:#fff;text-align:center;
  line-height:1.34;margin-bottom:14px}
h2 em{font-style:normal;color:var(--gold)}
.lede{text-align:center;font-size:15.5px;font-weight:500;color:rgba(147,197,253,.8);
  letter-spacing:-.025em;margin-bottom:42px}

/* ── 체크 리스트 ────────────────────── */
.list{display:flex;flex-direction:column;gap:13px;margin-bottom:44px}
.item{
  display:flex;align-items:flex-start;gap:16px;
  background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:23px 26px;position:relative;
}
.item__ck{
  flex:0 0 27px;height:27px;border-radius:50%;background:rgba(255,184,0,.16);
  border:1.5px solid var(--gold);color:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:900;line-height:1;margin-top:1px;
}
.item__t{font-size:17px;font-weight:700;color:#fff;letter-spacing:-.032em;line-height:1.6}
.item__t em{font-style:normal;color:var(--gold)}
.item__t .q{color:var(--sky);font-weight:600}

/* ── 자격 뱃지 ──────────────────────── */
.creds{display:flex;gap:14px}
.cred{
  flex:1;text-align:center;padding:24px 14px 22px;border-radius:16px;
  background:linear-gradient(180deg,rgba(59,130,246,.14),rgba(59,130,246,.04));
  border:1px solid rgba(147,197,253,.22);
}
.cred__n{font-size:27px;font-weight:900;color:#fff;letter-spacing:-.04em;line-height:1.1;
  margin-bottom:7px}
.cred__n em{font-style:normal;color:var(--gold)}
.cred__l{font-size:13px;font-weight:600;color:rgba(147,197,253,.9);letter-spacing:-.025em;
  line-height:1.5}

.sig{margin-top:34px;text-align:center;font-size:13.5px;font-weight:600;
  color:rgba(255,255,255,.5);letter-spacing:-.022em}
.sig strong{color:rgba(255,255,255,.9);font-weight:800;letter-spacing:.06em}
</style>

<div class="canvas">
  <div class="grid-tex"></div>
  <div class="glow" style="width:460px;height:300px;background:rgba(59,130,246,.18);left:200px;top:-130px"></div>

  <div class="inner">
    <h2>수출하는 사장님,<br>이것까지 아는 팀은 <em>드뭅니다</em></h2>
    <p class="lede">홈페이지만 만들고 끝내지 않습니다</p>

    <div class="list">
      <div class="item">
        <span class="item__ck">✓</span>
        <p class="item__t">
          수출바우처에 <em>'외국어 홈페이지 제작'</em>이 지원 항목인 것,
          <span class="q">알고 계셨나요?</span>
        </p>
      </div>
      <div class="item">
        <span class="item__ck">✓</span>
        <p class="item__t">바우처 지원금 규모와 신청 방법까지 <em>상담 시 안내</em>해 드립니다</p>
      </div>
      <div class="item">
        <span class="item__ck">✓</span>
        <p class="item__t">정부지원사업 서류를 직접 다뤄본 법인<em>(마이스터랩)</em>이 만듭니다</p>
      </div>
    </div>

    <div class="creds">
      <div class="cred">
        <p class="cred__n">특허 출원 <em>4건</em></p>
        <p class="cred__l">기술 기반 개발 법인</p>
      </div>
      <div class="cred">
        <p class="cred__n">고려대</p>
        <p class="cred__l">연구기관 MOU 체결</p>
      </div>
      <div class="cred">
        <p class="cred__n">광고 <em>+</em> IT</p>
        <p class="cred__l">양쪽 운영 경험 보유</p>
      </div>
    </div>

    <p class="sig"><strong>MEISTERCODE</strong> — 결국엔 사람의 손이 닿아야 합니다</p>
  </div>
</div>
